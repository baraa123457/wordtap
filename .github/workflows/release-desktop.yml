name: Build Desktop Player Installers (Windows & macOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.3)'
        required: false
        default: 'v1.0.3'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installers (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Desktop Player Dependencies
        working-directory: desktop-player
        run: npm install

      - name: Build Windows Installers (.exe, .msi, .zip)
        working-directory: desktop-player
        run: npx electron-builder --win --publish never

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: |
            desktop-player/dist-release/WordTap-Setup-x64.exe
            desktop-player/dist-release/WordTap-Setup-x64.msi
            desktop-player/dist-release/WordTap-Setup-x64.zip

  build-mac-arm64:
    name: Build macOS Installers (Apple Silicon arm64)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Desktop Player Dependencies
        working-directory: desktop-player
        run: npm install

      - name: Build macOS arm64 (.dmg & .zip)
        working-directory: desktop-player
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --mac --arm64 --publish never

      - name: Upload macOS arm64 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-mac-arm64
          path: |
            desktop-player/dist-release/WordTap-mac-arm64.dmg
            desktop-player/dist-release/WordTap-mac-arm64.zip

  build-mac-x64:
    name: Build macOS Installers (Intel x64)
    runs-on: macos-15-intel
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Desktop Player Dependencies
        working-directory: desktop-player
        run: npm install

      - name: Build macOS x64 (.dmg & .zip)
        working-directory: desktop-player
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --mac --x64 --publish never

      - name: Upload macOS x64 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-mac-x64
          path: |
            desktop-player/dist-release/WordTap-mac-x64.dmg
            desktop-player/dist-release/WordTap-mac-x64.zip

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-mac-arm64, build-mac-x64]
    runs-on: ubuntu-latest
    steps:
      - name: Download All Built Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Determine Tag Name
        id: tag_info
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=v1.0.3" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release (Windows + macOS)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: WordTap Desktop Player ${{ steps.tag_info.outputs.tag }}
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ### WordTap Desktop Video Player ${{ steps.tag_info.outputs.tag }}

            Official cross-platform desktop video player with VLC-style controls, interactive subtitles, instant dictionary lookups, and WordTap Cloud vocabulary synchronization.

            #### macOS Downloads:
            - **macOS Apple Silicon M1/M2/M3/M4 (`.dmg`)**: [WordTap-mac-arm64.dmg](https://github.com/${{ github.repository }}/releases/download/${{ steps.tag_info.outputs.tag }}/WordTap-mac-arm64.dmg)
            - **macOS Intel (`.dmg`)**: [WordTap-mac-x64.dmg](https://github.com/${{ github.repository }}/releases/download/${{ steps.tag_info.outputs.tag }}/WordTap-mac-x64.dmg)
            - **macOS Apple Silicon Portable (`.zip`)**: [WordTap-mac-arm64.zip](https://github.com/${{ github.repository }}/releases/download/${{ steps.tag_info.outputs.tag }}/WordTap-mac-arm64.zip)
            - **macOS Intel Portable (`.zip`)**: [WordTap-mac-x64.zip](https://github.com/${{ github.repository }}/releases/download/${{ steps.tag_info.outputs.tag }}/WordTap-mac-x64.zip)

            #### Windows Downloads:
            - **Windows Setup Installer (`.exe`)**: [WordTap-Setup-x64.exe](https://github.com/${{ github.repository }}/releases/download/${{ steps.tag_info.outputs.tag }}/WordTap-Setup-x64.exe)
            - **Windows MSI Installer (`.msi`)**: [WordTap-Setup-x64.msi](https://github.com/${{ github.repository }}/releases/download/${{ steps.tag_info.outputs.tag }}/WordTap-Setup-x64.msi)
            - **Windows Portable (`.zip`)**: [WordTap-Setup-x64.zip](https://github.com/${{ github.repository }}/releases/download/${{ steps.tag_info.outputs.tag }}/WordTap-Setup-x64.zip)
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
