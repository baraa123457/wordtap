name: Build Desktop Player Installers (.exe & .msi)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Windows Installers
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Desktop Player Dependencies
        working-directory: desktop-player
        run: |
          npm install

      - name: Build Windows Installers (NSIS .exe, WiX .msi, and Portable .zip)
        working-directory: desktop-player
        run: |
          npx electron-builder --win --publish never

      - name: Determine Tag Name
        id: tag_info
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=v1.0.0" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release with .exe and .msi
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: WordTap Desktop Player ${{ steps.tag_info.outputs.tag }}
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ### 🎬 WordTap Desktop Video Player ${{ steps.tag_info.outputs.tag }}

            Official desktop video player with VLC engine, interactive subtitles, instant dictionary lookups, and offline vocabulary synchronization with WordTap Cloud.

            #### 📦 Windows Downloads:
            - **Windows Setup Installer (`.exe`)**: [WordTap-Setup-x64.exe](https://github.com/${{ github.repository }}/releases/download/${{ steps.tag_info.outputs.tag }}/WordTap-Setup-x64.exe)
            - **Windows MSI Installer (`.msi`)**: [WordTap-Setup-x64.msi](https://github.com/${{ github.repository }}/releases/download/${{ steps.tag_info.outputs.tag }}/WordTap-Setup-x64.msi)
            - **Portable Standalone (`.zip`)**: [WordTap-Setup-x64.zip](https://github.com/${{ github.repository }}/releases/download/${{ steps.tag_info.outputs.tag }}/WordTap-Setup-x64.zip)

            #### 🚀 Highlights & Features:
            - **VLC Core Engine**: Plays MKV, MP4, AVI, WebM, and HEVC 4K/HDR with hardware acceleration.
            - **VLC Aspect Ratio Control**: Full support for 16:9, 4:3, 16:10, 2.35:1, and automatic DAR container detection (Press `A`).
            - **Hardware-Direct Audio**: Crystal-clear native audio output with 200% volume amplification.
            - **Automatic Dolby AC3 / DTS 5.1 Transcoding**: Real-time audio stream transcoding with zero lip-sync drift.
            - **VLC Speed Bar & Hotkeys**: Fine-tune speed from `0.25x` to `3.0x` with `[` / `]` hotkeys.
            - **VLsub OpenSubtitles Integration**: Search and auto-download subtitles inside the player.
            - **Dark & Light Cinema Themes**: Seamlessly toggle between Dark Theater and Daylight mode with the `T` key.
            - **Offline Storage**: Save words offline during flights and travel; words sync to your web library automatically when online.
          files: |
            desktop-player/dist-installers/WordTap-Setup-x64.exe
            desktop-player/dist-installers/WordTap-Setup-x64.msi
            desktop-player/dist-installers/WordTap-Setup-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
