<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>WordTap Chrome Extension Options</title>
  <style>
    :root {
      --bg: #f2f4fa;
      --card-bg: #ffffff;
      --ink: #12152e;
      --muted: #5e658a;
      --line: #e2e6f2;
      --focus: #facc3b;
      --brand: #0e1022;
      --accent: #facc3b;
      --accent-ink: #12152e;
      --accent-edge: #d4a311;
      --ok: #10b981;
      --ok-soft: #d1fae5;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0d1e;
        --card-bg: #141731;
        --ink: #eef1ff;
        --muted: #959cc2;
        --line: #222646;
        --brand: #0a0b18;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro", "Readex Pro", system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 660px;
      background: var(--card-bg);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
      padding: 36px 44px;
    }

    .header {
      text-align: center;
      margin-bottom: 36px;
    }

    .logo-container {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .logo-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--brand);
      letter-spacing: -0.02em;
    }
    .logo-title span { color: #d9ad12; }

    .page-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--muted);
    }

    .grid-row {
      display: flex;
      margin-bottom: 28px;
      align-items: flex-start;
    }

    .label-col {
      width: 180px;
      font-weight: 700;
      color: var(--ink);
      padding-top: 4px;
      flex-shrink: 0;
    }

    .control-col {
      flex: 1;
    }

    select.lang-select {
      width: 220px;
      padding: 7px 12px;
      font-size: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background-color: #fff;
      color: var(--ink);
      outline: none;
      cursor: pointer;
    }
    select.lang-select:focus {
      border-color: var(--focus);
      box-shadow: 0 0 0 2px rgba(58, 85, 255, 0.2);
    }

    .section-subtitle {
      font-weight: 600;
      margin-bottom: 14px;
      color: var(--ink);
    }

    .radio-option {
      margin-bottom: 14px;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .radio-option input[type="radio"] {
      margin-top: 3px;
      cursor: pointer;
      accent-color: var(--focus);
    }

    .radio-label-wrap {
      cursor: pointer;
    }

    .radio-title {
      font-weight: 500;
      color: var(--ink);
    }

    .radio-desc {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
      line-height: 1.4;
    }

    .button-row {
      margin-top: 36px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    button {
      font-size: 14px;
      font-weight: 600;
      padding: 8px 24px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-save {
      background: #2563eb;
      color: #ffffff;
      border: 1px solid #1d4ed8;
    }
    .btn-save:hover {
      background: #1d4ed8;
    }

    .btn-reset {
      background: #f1f5f9;
      color: #334155;
      border: 1px solid #cbd5e1;
    }
    .btn-reset:hover {
      background: #e2e8f0;
    }

    .status-msg {
      margin-left: 12px;
      font-size: 13px;
      color: var(--ok);
      font-weight: 600;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo-container">
        <svg width="32" height="23" viewBox="0 0 30 22" aria-hidden="true">
          <rect x="0.5" y="0.5" width="29" height="21" rx="5" fill="#151833" stroke="#262a52"/>
          <rect x="6" y="8" width="18" height="3" rx="1.5" fill="#fff"/>
          <rect x="9" y="14" width="12" height="2.5" rx="1.25" fill="#ffd23f"/>
        </svg>
        <span class="logo-title">Word<span>Tap</span></span>
      </div>
      <div class="page-title">Chrome Extension Options</div>
    </div>

    <form id="optionsForm">
      <!-- Primary Language -->
      <div class="grid-row">
        <div class="label-col">My primary language:</div>
        <div class="control-col">
          <select id="lang" class="lang-select">
            <option value="ar">Arabic</option>
            <option value="en">English</option>
            <option value="fr">French</option>
            <option value="es">Spanish</option>
            <option value="de">German</option>
            <option value="it">Italian</option>
            <option value="pt">Portuguese</option>
            <option value="tr">Turkish</option>
            <option value="ru">Russian</option>
            <option value="zh-CN">Chinese (Simplified)</option>
            <option value="ja">Japanese</option>
            <option value="ko">Korean</option>
            <option value="hi">Hindi</option>
            <option value="ur">Urdu</option>
            <option value="fa">Persian</option>
          </select>
        </div>
      </div>

      <!-- Pop-up translations -->
      <div class="grid-row">
        <div class="label-col">Pop-up translations:</div>
        <div class="control-col">
          <div class="section-subtitle">When I select a word or phrase:</div>

          <!-- Option 1: Icon (Recommended) -->
          <div class="radio-option">
            <input type="radio" id="mode-icon" name="selectionMode" value="icon" />
            <label class="radio-label-wrap" for="mode-icon">
              <div class="radio-title">Display small floating icon that I can click (Recommended for chat & reading).</div>
              <div class="radio-desc">
                Shows a tiny unobtrusive WordTap icon next to your selection so chat replies, code, and articles are never covered.
              </div>
            </label>
          </div>

          <!-- Option 2: Immediate -->
          <div class="radio-option">
            <input type="radio" id="mode-immediate" name="selectionMode" value="immediate" />
            <label class="radio-label-wrap" for="mode-immediate">
              <div class="radio-title">Immediately display pop-up card.</div>
              <div class="radio-desc">
                Automatically shows the translation card as soon as text is selected.
              </div>
            </label>
          </div>

          <!-- Option 3: Hold Alt Key -->
          <div class="radio-option">
            <input type="radio" id="mode-alt" name="selectionMode" value="alt" />
            <label class="radio-label-wrap" for="mode-alt">
              <div class="radio-title">Only show pop-up when holding Alt / Option key while selecting.</div>
              <div class="radio-desc">
                Normal highlighting or copying text in chats won't trigger pop-ups unless Alt is pressed.
              </div>
            </label>
          </div>

          <!-- Option 4: Off -->
          <div class="radio-option">
            <input type="radio" id="mode-off" name="selectionMode" value="off" />
            <label class="radio-label-wrap" for="mode-off">
              <div class="radio-title">Don't display icon or pop-up.</div>
              <div class="radio-desc">
                You can still translate words in video subtitles or by using the WordTap extension popup.
              </div>
            </label>
          </div>

          <!-- AI Chat Protection Checkbox -->
          <div style="margin-top: 18px; padding-top: 14px; border-top: 1px dashed var(--line);">
            <label style="display: flex; align-items: flex-start; gap: 8px; cursor: pointer;">
              <input type="checkbox" id="protectAiChats" checked style="margin-top: 3px; accent-color: var(--focus);" />
              <div>
                <div style="font-weight: 600; color: var(--ink);">🤖 Protect AI Chat Assistants (Claude, ChatGPT, Gemini, Copilot)</div>
                <div style="font-size: 12px; color: var(--muted); margin-top: 2px;">
                  Always use the non-intrusive floating icon on AI chat sites so AI answers are never blocked or covered while reading.
                </div>
              </div>
            </label>
          </div>
        </div>
      </div>

      <!-- Save & Reset -->
      <div class="button-row">
        <button type="submit" class="btn-save" id="saveBtn">Save</button>
        <button type="button" class="btn-reset" id="resetBtn">Reset</button>
        <span class="status-msg" id="statusMsg">Options saved.</span>
      </div>
    </form>
  </div>

  <script src="options.js"></script>
</body>
</html>
