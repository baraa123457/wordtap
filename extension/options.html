<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>WordTap Chrome Extension Options</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --ink: #14172f;
      --muted: #5a6082;
      --line: #dde1f0;
      --focus: #3a55ff;
      --brand: #151833;
      --accent: #facc3b;
      --accent-ink: #261d00;
      --accent-edge: #c7980c;
      --ok: #0f8f5c;
      --ok-soft: #d9f4e8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 660px;
      background: var(--card-bg);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(20, 23, 47, 0.06);
      padding: 36px 44px;
    }

    .header {
      text-align: center;
      margin-bottom: 36px;
    }

    .logo-container {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .logo-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--brand);
      letter-spacing: -0.02em;
    }
    .logo-title span { color: #d9ad12; }

    .page-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--muted);
    }

    .grid-row {
      display: flex;
      margin-bottom: 28px;
      align-items: flex-start;
    }

    .label-col {
      width: 180px;
      font-weight: 700;
      color: var(--ink);
      padding-top: 4px;
      flex-shrink: 0;
    }

    .control-col {
      flex: 1;
    }

    select.lang-select {
      width: 220px;
      padding: 7px 12px;
      font-size: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background-color: #fff;
      color: var(--ink);
      outline: none;
      cursor: pointer;
    }
    select.lang-select:focus {
      border-color: var(--focus);
      box-shadow: 0 0 0 2px rgba(58, 85, 255, 0.2);
    }

    .section-subtitle {
      font-weight: 600;
      margin-bottom: 14px;
      color: var(--ink);
    }

    .radio-option {
      margin-bottom: 14px;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .radio-option input[type="radio"] {
      margin-top: 3px;
      cursor: pointer;
      accent-color: var(--focus);
    }

    .radio-label-wrap {
      cursor: pointer;
    }

    .radio-title {
      font-weight: 500;
      color: var(--ink);
    }

    .radio-desc {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
      line-height: 1.4;
    }

    .button-row {
      margin-top: 36px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    button {
      font-size: 14px;
      font-weight: 600;
      padding: 8px 24px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-save {
      background: #2563eb;
      color: #ffffff;
      border: 1px solid #1d4ed8;
    }
    .btn-save:hover {
      background: #1d4ed8;
    }

    .btn-reset {
      background: #f1f5f9;
      color: #334155;
      border: 1px solid #cbd5e1;
    }
    .btn-reset:hover {
      background: #e2e8f0;
    }

    .status-msg {
      margin-left: 12px;
      font-size: 13px;
      color: var(--ok);
      font-weight: 600;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo-container">
        <svg width="32" height="23" viewBox="0 0 30 22" aria-hidden="true">
          <rect x="0.5" y="0.5" width="29" height="21" rx="5" fill="#151833" stroke="#262a52"/>
          <rect x="6" y="8" width="18" height="3" rx="1.5" fill="#fff"/>
          <rect x="9" y="14" width="12" height="2.5" rx="1.25" fill="#ffd23f"/>
        </svg>
        <span class="logo-title">Word<span>Tap</span></span>
      </div>
      <div class="page-title">Chrome Extension Options</div>
    </div>

    <form id="optionsForm">
      <!-- Primary Language -->
      <div class="grid-row">
        <div class="label-col">My primary language:</div>
        <div class="control-col">
          <select id="lang" class="lang-select">
            <option value="ar">Arabic</option>
            <option value="en">English</option>
            <option value="fr">French</option>
            <option value="es">Spanish</option>
            <option value="de">German</option>
            <option value="it">Italian</option>
            <option value="pt">Portuguese</option>
            <option value="tr">Turkish</option>
            <option value="ru">Russian</option>
            <option value="zh-CN">Chinese (Simplified)</option>
            <option value="ja">Japanese</option>
            <option value="ko">Korean</option>
            <option value="hi">Hindi</option>
            <option value="ur">Urdu</option>
            <option value="fa">Persian</option>
          </select>
        </div>
      </div>

      <!-- Pop-up translations -->
      <div class="grid-row">
        <div class="label-col">Pop-up translations:</div>
        <div class="control-col">
          <div class="section-subtitle">When I select a word or phrase:</div>

          <!-- Option 1: Icon -->
          <div class="radio-option">
            <input type="radio" id="mode-icon" name="selectionMode" value="icon" />
            <label class="radio-label-wrap" for="mode-icon">
              <div class="radio-title">Display icon that I can click to show pop-up.</div>
            </label>
          </div>

          <!-- Option 2: Immediate (Default) -->
          <div class="radio-option">
            <input type="radio" id="mode-immediate" name="selectionMode" value="immediate" />
            <label class="radio-label-wrap" for="mode-immediate">
              <div class="radio-title">Immediately display pop-up.</div>
              <div class="radio-desc">
                Any text selected in your Chrome browser is sent to the translation server to determine if a translation should be displayed.
              </div>
            </label>
          </div>

          <!-- Option 3: Off -->
          <div class="radio-option">
            <input type="radio" id="mode-off" name="selectionMode" value="off" />
            <label class="radio-label-wrap" for="mode-off">
              <div class="radio-title">Don't display icon or pop-up.</div>
              <div class="radio-desc">
                You can still translate words in video subtitles or by using the WordTap extension popup.
              </div>
            </label>
          </div>
        </div>
      </div>

      <!-- Save & Reset -->
      <div class="button-row">
        <button type="submit" class="btn-save" id="saveBtn">Save</button>
        <button type="button" class="btn-reset" id="resetBtn">Reset</button>
        <span class="status-msg" id="statusMsg">Options saved.</span>
      </div>
    </form>
  </div>

  <script src="options.js"></script>
</body>
</html>
