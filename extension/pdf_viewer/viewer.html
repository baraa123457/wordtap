<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WordTap PDF Reader</title>
  <link rel="stylesheet" href="lib/pdf_viewer.css" />
  <link rel="stylesheet" href="viewer.css" />
</head>
<body>
  <!-- Header Toolbar -->
  <header class="viewer-header">
    <div class="header-left">
      <a href="#" class="brand-badge" id="brandLink" title="WordTap Reader">
        <svg class="brand-logo" viewBox="0 0 30 22" aria-hidden="true">
          <rect x="0.5" y="0.5" width="29" height="21" rx="5" fill="#151833" stroke="#262a52"/>
          <rect x="6" y="8" width="18" height="3" rx="1.5" fill="#ffffff"/>
          <rect x="9" y="14" width="12" height="2.5" rx="1.25" fill="#facc3b"/>
        </svg>
        <span class="brand-title"><span class="brand-word">Word</span><span class="brand-tap">Tap</span> Reader</span>
      </a>
      <span class="doc-divider"></span>
      <span class="doc-name" id="docName" title="PDF Document">Loading…</span>
    </div>

    <div class="header-center">
      <!-- Page Navigation -->
      <button type="button" class="nav-btn" id="prevPageBtn" title="Previous Page (Left Arrow / Page Up)">◀</button>
      <input type="number" class="page-num-input" id="pageNumberInput" min="1" value="1" aria-label="Page number" />
      <span class="page-count-text">/ <span id="numPagesSpan">--</span></span>
      <button type="button" class="nav-btn" id="nextPageBtn" title="Next Page (Right Arrow / Page Down)">▶</button>

      <span class="doc-divider"></span>

      <!-- Zoom Controls -->
      <button type="button" class="zoom-btn" id="zoomOutBtn" title="Zoom Out (Ctrl -)">−</button>
      <select class="scale-select" id="scaleSelect" aria-label="Zoom scale">
        <option value="auto">Automatic</option>
        <option value="page-actual">100%</option>
        <option value="page-fit">Fit Page</option>
        <option value="page-width" selected>Fit Width</option>
        <option value="0.75">75%</option>
        <option value="1.0">100%</option>
        <option value="1.25">125%</option>
        <option value="1.5">150%</option>
        <option value="2.0">200%</option>
      </select>
      <button type="button" class="zoom-btn" id="zoomInBtn" title="Zoom In (Ctrl +)">+</button>
    </div>

    <div class="header-right">
      <!-- Search in Document -->
      <div class="find-box-wrap">
        <input type="search" class="find-input" id="findInput" placeholder="Find in document…" aria-label="Find in document" />
        <span class="find-count" id="findMatchCount"></span>
        <button type="button" class="find-btn" id="findPrevBtn" title="Previous match (Shift+Enter)">▲</button>
        <button type="button" class="find-btn" id="findNextBtn" title="Next match (Enter)">▼</button>
      </div>

      <button type="button" class="ocr-tool-btn" id="ocrToolBtn" title="Screen OCR for scanned text (Alt+S)">
        <span>📸 OCR</span>
      </button>

      <button type="button" class="nav-btn" id="openOriginalBtn" title="Open original PDF directly in browser">
        ↗
      </button>
    </div>
  </header>

  <!-- PDF.js Viewer Canvas & Scroll Container -->
  <main id="viewerContainer" class="viewer-container" tabindex="0">
    <div id="viewer" class="pdfViewer"></div>
  </main>

  <!-- Loading State Overlay -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
    <div class="loading-text" id="loadingText">Opening document with WordTap…</div>
  </div>

  <!-- Error State Overlay -->
  <div class="error-overlay" id="errorOverlay">
    <div class="error-card">
      <div class="error-icon" id="errorIcon">⚠️</div>
      <div class="error-title" id="errorTitle">Could not open PDF</div>
      <div class="error-desc" id="errorDesc">The requested file could not be loaded.</div>
      <div class="error-actions" id="errorActions">
        <button type="button" class="error-btn" id="retryLoadBtn">Retry</button>
      </div>
    </div>
  </div>

  <!-- Scanned PDF Notice -->
  <div class="scanned-banner" id="scannedBanner">
    <span>💡 This PDF appears to be scanned with no text layer.</span>
    <button type="button" class="scanned-banner-btn" id="scannedOcrBtn">Use OCR Capture (Alt+S)</button>
  </div>

  <!-- Load Modules -->
  <script type="module" src="viewer.js"></script>
  <!-- Reuse existing select-translate tooltip card script without UI fork -->
  <script src="../select-translate.js"></script>
</body>
</html>
