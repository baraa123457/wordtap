<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WordTap PDF Reader</title>
  <link rel="stylesheet" href="lib/pdf_viewer.css" />
  <link rel="stylesheet" href="viewer.css" />
</head>
<body data-reader-theme="dark">
  <!-- Liquid Glass Header Toolbar -->
  <header class="viewer-header">
    <div class="header-left">
      <a href="#" class="brand-badge" id="brandLink" title="WordTap Reader">
        <svg class="brand-logo" viewBox="0 0 30 22" aria-hidden="true">
          <rect x="0.5" y="0.5" width="29" height="21" rx="5" fill="#151833" stroke="#262a52"/>
          <rect x="6" y="8" width="18" height="3" rx="1.5" fill="#ffffff"/>
          <rect x="9" y="14" width="12" height="2.5" rx="1.25" fill="#facc3b"/>
        </svg>
        <span class="brand-title"><span class="brand-word">Word</span><span class="brand-tap">Tap</span></span>
      </a>
      <span class="doc-divider"></span>
      <div class="doc-badge" title="PDF Document">
        <svg class="doc-icon" viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 2H4a1 1 0 00-1 1v10a1 1 0 001 1h8a1 1 0 001-1V6l-3-4z"/>
          <path d="M9 2v4h4"/>
        </svg>
        <span class="doc-name" id="docName">Loading…</span>
      </div>
    </div>

    <div class="header-center">
      <!-- Segmented Page Navigation Pill -->
      <div class="control-segment page-segment" role="group" aria-label="Page navigation">
        <button type="button" class="segment-btn icon-btn" id="prevPageBtn" title="Previous Page (Left Arrow / Page Up)" aria-label="Previous page">
          <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 13L5 8l5-5"/>
          </svg>
        </button>
        <div class="page-field-wrap">
          <input type="number" class="page-num-input" id="pageNumberInput" min="1" value="1" aria-label="Current page number" />
          <span class="page-count-text">/ <span id="numPagesSpan">--</span></span>
        </div>
        <button type="button" class="segment-btn icon-btn" id="nextPageBtn" title="Next Page (Right Arrow / Page Down)" aria-label="Next page">
          <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 3l5 5-5 5"/>
          </svg>
        </button>
      </div>

      <!-- Segmented Zoom Controller Pill -->
      <div class="control-segment zoom-segment" role="group" aria-label="Zoom controls">
        <button type="button" class="segment-btn icon-btn" id="zoomOutBtn" title="Zoom Out (Ctrl -)" aria-label="Zoom out">
          <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <path d="M3.5 8h9"/>
          </svg>
        </button>
        <div class="select-wrap">
          <select class="scale-select" id="scaleSelect" aria-label="Zoom scale selection">
            <option value="auto">Auto</option>
            <option value="page-actual" selected>100%</option>
            <option value="page-fit">Fit Page</option>
            <option value="page-width">Fit Width</option>
            <option value="0.5">50%</option>
            <option value="0.75">75%</option>
            <option value="1.25">125%</option>
            <option value="1.5">150%</option>
            <option value="2.0">200%</option>
            <option value="3.0">300%</option>
          </select>
          <svg class="select-chevron" viewBox="0 0 16 16" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 6l4 4 4-4"/>
          </svg>
        </div>
        <button type="button" class="segment-btn icon-btn" id="zoomInBtn" title="Zoom In (Ctrl +)" aria-label="Zoom in">
          <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <path d="M8 3.5v9M3.5 8h9"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="header-right">
      <!-- Search in Document Pill -->
      <div class="find-box-wrap" role="search" aria-label="Search within document">
        <svg class="find-icon" viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="6.5" cy="6.5" r="4.5"/>
          <path d="M10 10l3.8 3.8"/>
        </svg>
        <input type="search" class="find-input" id="findInput" placeholder="Find… (Ctrl+F)" aria-label="Find in document" />
        <span class="find-count" id="findMatchCount" aria-live="polite"></span>
        <button type="button" class="find-btn" id="findPrevBtn" title="Previous match (Shift+Enter)" aria-label="Previous match">
          <svg viewBox="0 0 16 16" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3.5 10l4.5-4.5 4.5 4.5"/>
          </svg>
        </button>
        <button type="button" class="find-btn" id="findNextBtn" title="Next match (Enter)" aria-label="Next match">
          <svg viewBox="0 0 16 16" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3.5 6l4.5 4.5 4.5-4.5"/>
          </svg>
        </button>
      </div>

      <!-- Dark / Light Theme Toggle -->
      <button type="button" class="theme-toggle-btn" id="readerThemeBtn" title="Switch between Dark and Light Theme" aria-label="Toggle dark and light theme">
        <span class="theme-icon-wrap" id="themeIconWrap"></span>
      </button>

      <!-- Dark Page Contrast Mode Toggle -->
      <button type="button" class="page-mode-btn" id="pageModeBtn" title="Toggle Dark/Light Page Reading Mode" aria-label="Toggle dark page reading mode">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M12 2a10 10 0 0 1 0 20z" fill="currentColor"></path>
        </svg>
      </button>

      <!-- OCR Tool -->
      <button type="button" class="ocr-tool-btn" id="ocrToolBtn" title="Screen OCR for scanned pages (Alt+S)" aria-label="Capture text with OCR">
        <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 5V3a1 1 0 011-1h2M11 2h2a1 1 0 011 1v2M14 11v2a1 1 0 01-1 1h-2M5 14H3a1 1 0 01-1-1v-2"/>
          <circle cx="8" cy="8" r="2.5"/>
        </svg>
        <span class="ocr-text">OCR</span>
      </button>

      <!-- Open Original -->
      <button type="button" class="open-original-btn" id="openOriginalBtn" title="Open original PDF in browser tab" aria-label="Open original PDF">
        <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 3H3a1 1 0 00-1 1v9a1 1 0 001 1h9a1 1 0 001-1V9M10 3h3v3M8.5 7.5L13 3"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- PDF.js Viewer Canvas & Scroll Container -->
  <div id="viewerContainer" class="viewer-container" tabindex="0">
    <div id="viewer" class="pdfViewer"></div>
  </div>

  <!-- Loading State Overlay -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
    <div class="loading-text" id="loadingText">Opening document with WordTap…</div>
  </div>

  <!-- Error State Overlay -->
  <div class="error-overlay" id="errorOverlay">
    <div class="error-card">
      <div class="error-icon" id="errorIcon">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#facc3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
      </div>
      <div class="error-title" id="errorTitle">Could not open PDF</div>
      <div class="error-desc" id="errorDesc">The requested file could not be loaded.</div>
      <div class="error-actions" id="errorActions">
        <button type="button" class="error-btn" id="retryLoadBtn">Retry</button>
      </div>
    </div>
  </div>

  <!-- Scanned PDF Notice -->
  <div class="scanned-banner" id="scannedBanner">
    <span class="scanned-banner-text">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:6px;">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="16" x2="12" y2="12"></line>
        <line x1="12" y1="8" x2="12.01" y2="8"></line>
      </svg>
      This PDF appears to be scanned with no text layer.
    </span>
    <button type="button" class="scanned-banner-btn" id="scannedOcrBtn">Use OCR Capture (Alt+S)</button>
  </div>

  <!-- Load Modules -->
  <script type="module" src="viewer.js"></script>
  <!-- Reuse existing select-translate tooltip card script without UI fork -->
  <script src="../select-translate.js"></script>
</body>
</html>
